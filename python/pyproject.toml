[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lockstep-loop"
version = "0.2.0"
description = "Run one agent prompt across thousands of similar environments in lockstep, splitting conversations only where tool results diverge."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep_loop"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
