[package]
name = "lockstep-loop"
version = "0.2.0"
edition = "2024"
description = "Run one agent prompt across many similar environments in lockstep"
readme = "README.md"
license = "MIT"
repository = "https://github.com/kaeluka/lockstep-loop"

[dependencies]
indexmap = "2"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

[dev-dependencies]
anyhow = "1"
jsonschema = { version = "0.46", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[[example]]
name = "agent_file"
test = true
